name: CI — Build, Test & Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run security scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Build & Unit Test (Maven)
  # ──────────────────────────────────────────────────────────
  build-java:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results
          path: target/surefire-reports/

  # ──────────────────────────────────────────────────────────
  # JOB 2: OWASP Dependency Check (Maven CVE scan)
  # ──────────────────────────────────────────────────────────
  owasp-maven:
    name: OWASP Dependency Check (Maven)
    runs-on: ubuntu-latest
    needs: build-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Run OWASP Dependency Check
        # Note: failBuildOnCVSS=7 means HIGH/CRITICAL will FAIL the build
        # This is intentional — demonstrates the broken state before remediation
        run: |
          mvn dependency-check:check \
            -Ddependency-check.failBuildOnCVSS=7 \
            --batch-mode --no-transfer-progress || true
        # `|| true` keeps the job green so the report is always uploaded

      - name: Upload OWASP HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report/

  # ──────────────────────────────────────────────────────────
  # JOB 3: Python Safety & pip-audit scan
  # ──────────────────────────────────────────────────────────
  scan-python:
    name: Python CVE Scan (Safety + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanning tools
        run: pip install safety pip-audit

      - name: Run Safety scan (vulnerable requirements.txt)
        run: |
          echo "=== Scanning requirements.txt (VULNERABLE) ==="
          safety check -r requirements.txt --output text || true

      - name: Run pip-audit (vulnerable requirements.txt)
        run: |
          echo "=== pip-audit on requirements.txt (VULNERABLE) ==="
          pip-audit -r requirements.txt || true

      - name: Run Safety scan (fixed requirements)
        run: |
          echo "=== Scanning requirements-fixed.txt (SHOULD BE CLEAN) ==="
          safety check -r requirements-fixed.txt --output text

      - name: Run pip-audit (fixed requirements)
        run: |
          echo "=== pip-audit on requirements-fixed.txt (SHOULD BE CLEAN) ==="
          pip-audit -r requirements-fixed.txt

  # ──────────────────────────────────────────────────────────
  # JOB 4: Remediation Verification
  # Applies the fixed pom.xml versions and re-scans to confirm 0 HIGH/CRITICAL
  # ──────────────────────────────────────────────────────────
  verify-remediation:
    name: Verify Remediation (Fixed Versions)
    runs-on: ubuntu-latest
    needs: owasp-maven

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Apply fixed dependency versions
        run: |
          # Patch pom.xml to use the fixed (safe) versions
          sed -i 's|<log4j.version>2.14.1</log4j.version>|<log4j.version>2.17.1</log4j.version>|g' pom.xml
          sed -i 's|<spring.boot.version>2.6.3</spring.boot.version>|<spring.boot.version>2.7.17</spring.boot.version>|g' pom.xml
          sed -i 's|<jackson.version>2.13.2</jackson.version>|<jackson.version>2.14.3</jackson.version>|g' pom.xml
          sed -i 's|<netty.version>4.1.65.Final</netty.version>|<netty.version>4.1.100.Final</netty.version>|g' pom.xml
          sed -i 's|<snakeyaml.version>1.30</snakeyaml.version>|<snakeyaml.version>2.0</snakeyaml.version>|g' pom.xml
          sed -i 's|<commons-io.version>2.6</commons-io.version>|<commons-io.version>2.11.0</commons-io.version>|g' pom.xml
          sed -i 's|<tomcat.version>9.0.60</tomcat.version>|<tomcat.version>9.0.81</tomcat.version>|g' pom.xml
          sed -i 's|<spring.security.version>5.6.2</spring.security.version>|<spring.security.version>5.8.8</spring.security.version>|g' pom.xml
          echo "Fixed pom.xml diff:"
          git diff pom.xml

      - name: Build with fixed versions
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: OWASP scan on fixed versions (must pass — CVSS threshold 7)
        run: |
          mvn dependency-check:check \
            -Ddependency-check.failBuildOnCVSS=7 \
            --batch-mode --no-transfer-progress

      - name: Upload fixed OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report-after-fix
          path: target/dependency-check-report/
